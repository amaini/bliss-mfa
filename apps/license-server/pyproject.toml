[project]
name = "bliss-license-server"
version = "0.1.0"
description = "Central licensing and billing control plane for Bliss Secure MFA"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "cryptography>=45,<47",
  "stripe>=12,<13",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are intentionally evaluated in defaults.
extend-immutable-calls = ["fastapi.Depends"]
