[project]
name = "bliss-mfa-api"
version = "0.1.0"
description = "Management API for Bliss Secure MFA"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "alembic>=1.16,<2",
  "stripe>=12,<13",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
