name: Appliance CI

on:
  pull_request:
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "apps/license-server/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - "services/multiotp-adapter/**"
      - ".github/workflows/appliance-ci.yml"
      - "scripts/**"
      - "tools/check_portal_origins.py"
  push:
    branches: [main]
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "apps/license-server/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - "services/multiotp-adapter/**"
      - ".github/workflows/appliance-ci.yml"
      - "scripts/**"
      - "tools/check_portal_origins.py"

jobs:
  client-updater:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest cryptography httpx ruff
      - run: ruff check --select E4,E7,E9,F scripts/client-update.py scripts/publish-client-update.py scripts/tests/test_client_update.py
      - run: pytest -q scripts/tests/test_client_update.py

  multiotp-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/multiotp-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check --select E4,E7,E9,F adapter tests
      - run: pytest -q

  appliance-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check appliance tests
      - run: pytest -q

  license-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_server tests
      - run: pytest -q
      - run: ruff check ../../scripts/client-update.py ../../scripts/publish-client-update.py ../../scripts/tests/test_client_update.py
      - run: pytest -q ../../scripts/tests/test_client_update.py

  license-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_agent tests
      - run: pytest -q

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/appliance-portal/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.28,<1"
      - run: python ../../tools/check_portal_origins.py --portal . --output ../../outputs/portal-origin-results.json
