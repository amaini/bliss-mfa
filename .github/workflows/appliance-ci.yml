name: Appliance CI

on:
  pull_request:
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "apps/license-server/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - ".github/workflows/appliance-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "apps/license-server/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - ".github/workflows/appliance-ci.yml"

jobs:
  appliance-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check appliance tests
      - run: pytest -q

  license-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_server tests
      - run: pytest -q

  license-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_agent tests
      - run: pytest -q

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/appliance-portal/package.json
      - run: npm install
      - run: npm run build
