name: Appliance CI

on:
  pull_request:
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "tools/check_portal_origins.py"
      - "apps/license-server/**"
      - "windows_installer/**"
      - "scripts/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - "services/multiotp-adapter/**"
      - ".github/workflows/appliance-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "tools/check_portal_origins.py"
      - "apps/license-server/**"
      - "windows_installer/**"
      - "scripts/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - "services/multiotp-adapter/**"
      - ".github/workflows/appliance-ci.yml"

jobs:
  multiotp-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/multiotp-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check --select E4,E7,E9,F adapter tests
      - run: pytest -q

  appliance-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check appliance tests
      - run: pytest -q

  license-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_server tests
      - run: pytest -q

  license-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_agent tests
      - run: pytest -q

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/appliance-portal/package.json
      - run: npm install
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.28,<1"
      - run: python ../../tools/check_portal_origins.py --portal . --output ../../outputs/portal-origin-results.json

  installer-transactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/license-server[dev]" httpx
      - run: ruff check --select E4,E7,E9,F windows_installer scripts
      - run: pytest windows_installer/tests -q

  windows-script-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer and Windows runtime scripts without executing them
        shell: powershell
        run: |
          $failures=@()
          Get-ChildItem windows_installer,scripts -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $syntaxErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$syntaxErrors) | Out-Null
            $failures+=$syntaxErrors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
