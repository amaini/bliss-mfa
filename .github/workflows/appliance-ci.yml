name: Appliance CI

on:
  pull_request:
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "apps/license-server/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - "services/multiotp-adapter/**"
      - ".github/workflows/appliance-ci.yml"
      - "scripts/**"
      - "tools/check_portal_origins.py"
      - "deployment/windows/**"
  push:
    branches: [main]
    paths:
      - "apps/appliance-api/**"
      - "apps/appliance-portal/**"
      - "apps/license-server/**"
      - "services/license-agent/**"
      - "services/multiotp-mock/**"
      - "services/multiotp-adapter/**"
      - ".github/workflows/appliance-ci.yml"
      - "scripts/**"
      - "tools/check_portal_origins.py"
      - "deployment/windows/**"

jobs:
  client-updater:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest cryptography httpx ruff
      - run: ruff check --select E4,E7,E9,F scripts/client-update.py scripts/publish-client-update.py scripts/build-vm-package.py scripts/generate-update-keys.py scripts/engine_supervisor.py scripts/run-engine.py scripts/appliance-runtime.py scripts/tests
      - run: pytest -q scripts/tests

  multiotp-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/multiotp-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check --select E4,E7,E9,F adapter tests
      - run: pytest -q

  appliance-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check appliance tests
      - run: pytest -q

  license-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_server tests
      - run: pytest -q
      - run: ruff check ../../scripts/client-update.py ../../scripts/publish-client-update.py ../../scripts/tests/test_client_update.py
      - run: pytest -q ../../scripts/tests/test_client_update.py

  license-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check license_agent tests
      - run: pytest -q

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/appliance-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same Node.js as the runtime shipped to customers (deployment/windows/build-inputs.json).
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: apps/appliance-portal/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.28,<1"
      - run: python ../../tools/check_portal_origins.py --portal . --output ../../outputs/portal-origin-results.json

  windows-release:
    # Builds the complete customer release from pinned, hash-verified inputs on a clean
    # Windows runner. Uses a throwaway update key (artifacts are labelled -TEST); the
    # production update key and Authenticode signing are not available to CI.
    runs-on: windows-latest
    needs: [client-updater, portal]
    env:
      RELEASE_VERSION: "0.1.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the pinned multiOTP engine commit
        run: git fetch --no-tags origin engine/windows-prototype
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: apps/appliance-portal/package-lock.json
      - run: python -m pip install --upgrade pip cryptography httpx
      - uses: actions/cache@v4
        with:
          path: build-input-cache
          key: build-inputs-${{ hashFiles('deployment/windows/build-inputs.json') }}
      - name: Fetch and verify pinned inputs
        run: python scripts/fetch-build-inputs.py --output build/fetched --cache build-input-cache
      - name: Build and verify the release
        run: python scripts/build-release.py --version $env:RELEASE_VERSION --inputs build/fetched --output build/release --test-update-key
      - name: Show release checksums
        run: Get-Content build/release/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: bliss-mfa-windows-${{ env.RELEASE_VERSION }}-TEST-${{ github.sha }}
          # Never upload build/release/test-signing (throwaway private key).
          path: |
            build/release/*.zip
            build/release/*.signed.json
            build/release/*.sha256
            build/release/release.json
          if-no-files-found: error
